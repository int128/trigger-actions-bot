name: run

on:
  workflow_dispatch:
  schedule:
    - cron: '0/30 * * * *'
  pull_request:
    paths:
      - .github/workflows/run.yaml
  push:
    branches:
      - main
    paths:
      - .github/workflows/run.yaml

jobs:
  trigger-actions-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ${{ case(github.ref == 'refs/heads/main', 'production', '') }}
    permissions:
      contents: write
      pull-requests: read
    steps:
      - if: github.ref == 'refs/heads/main'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ secrets.BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - uses: int128/trigger-actions-bot@973181a8c5847c5d3cbb5616362b2365200a167c # v2.19.0
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}
