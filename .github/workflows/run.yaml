name: run

on:
  workflow_dispatch:
  schedule:
    - cron: '0/30 * * * *'
  pull_request:
    paths:
      - .github/workflows/run.yaml
  push:
    branches:
      - main
    paths:
      - .github/workflows/run.yaml

jobs:
  trigger-actions-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ${{ case(github.ref == 'refs/heads/main', 'production', '') }}
    permissions:
      contents: write
      pull-requests: read
      id-token: write
    steps:
      - if: github.ref == 'refs/heads/main'
        uses: int128/aws-kms-github-app-token-action@c9b59687f3225bc01678db8f232b3a0b9efde688 # v0.6.0
        id: app-token
        with:
          role-to-assume: ${{ secrets.APP_AWS_IAM_ROLE_ARN }}
          aws-region: us-west-2
          kms-key-id: alias/github-app-int128-bot
          permission-contents: write
          permission-pull-requests: read
          owner: ${{ github.repository_owner }}
      - uses: int128/trigger-actions-bot@9f20469fa9e61c72d6810cb4faf4ae78a5f2ea6c # v2.20.0
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}
